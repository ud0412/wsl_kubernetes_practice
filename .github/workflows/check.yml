name: Foundation source checks
on: [push, pull_request]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r requirements-tools.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_repository.py
      - run: find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - run: shellcheck scripts/*.sh scripts/lib/*.sh scripts/steps/*.sh --exclude=SC1090,SC1091,SC2034,SC2154
